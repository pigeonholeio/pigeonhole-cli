name: ci
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache-dependency-path: src/go.sum
      - name: build
        run: go build ./...
      - name: vet
        run: go vet ./...

  tests:
    # Non-blocking: pre-existing token-expiry test failures predate the
    # Cloudflare rebuild; they are reconciled as part of the CLI protocol rewrite.
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache-dependency-path: src/go.sum
      - run: go test ./...
